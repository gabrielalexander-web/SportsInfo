{% extends "base.html" %}
{% block title %}Crear cuenta — SportsInfo{% endblock %}
{% block content %}
    <div class="panel-block" style="max-width:420px;margin:20px auto;">
        <h2 style="font-size:1.5rem;text-transform:none;letter-spacing:0;margin-bottom:18px;">Crear cuenta</h2>
        <form method="post">
            <div class="field"><label>Nombre</label><input type="text" name="name" required></div>
            <div class="field"><label>Correo</label><input type="email" name="email" required></div>
            <div class="field"><label>Contraseña</label><input type="password" name="password" required></div>
            <div class="field">
                <label>Sexo</label>
                <select name="sex">
                    <option value="">Prefiero no decirlo</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <button type="submit" class="btn btn-amber btn-block">Crear cuenta</button>
        </form>
        <p style="color:var(--ink-dim);font-size:0.85rem;margin-top:16px;text-align:center;">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" style="color:var(--amber);">Inicia sesión</a>
        </p>
    </div>
{% endblock %}
