{% extends "base.html" %}
{% block title %}Editar {{ sport.name }} — SportsInfo{% endblock %}
{% block content %}
    <a href="{{ url_for('detalle_deporte', sport_id=sport.id) }}" class="back-link">← Volver</a>
    <h2 style="font-size:1.6rem;text-transform:none;letter-spacing:0;">Editar {{ sport.name }}</h2>
    <form method="post" class="panel-block" style="max-width:640px;margin-top:16px;">
        {% include "_form-deporte.html" %}
        <button type="submit" class="btn btn-amber">Guardar cambios</button>
    </form>
{% endblock %}
