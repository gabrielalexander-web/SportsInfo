{% extends "base.html" %}
{% block title %}Iniciar sesión — SportsInfo{% endblock %}
{% block content %}
    <div class="panel-block" style="max-width:420px;margin:20px auto;">
        <h2 style="font-size:1.5rem;text-transform:none;letter-spacing:0;margin-bottom:18px;">Iniciar sesión</h2>
        <form method="post">
            <div class="field"><label>Correo</label><input type="email" name="email" required></div>
            <div class="field"><label>Contraseña</label><input type="password" name="password" required></div>
            <button type="submit" class="btn btn-amber btn-block">Iniciar sesión</button>
        </form>
        <p style="color:var(--ink-dim);font-size:0.85rem;margin-top:16px;text-align:center;">
            ¿No tienes cuenta? <a href="{{ url_for('registro') }}" style="color:var(--amber);">Créala aquí</a>
        </p>
    </div>
{% endblock %}
